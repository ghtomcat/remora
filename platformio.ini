; PlatformIO Project Configuration File for RAK4630
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:wiscore_rak4631]
platform = nordicnrf52
board = wiscore_rak4631
framework = arduino

; Serial Monitor options
monitor_speed = 115200

; Build options
build_flags =
    -D ARDUINO_RAKWIRELESS_RAK4630
    -D ARDUINO_ARCH_NRF52
    -D NRF52_SERIES
    -D GPS_ENABLED=1
    -D SHT31_ENABLED=1
    -D SPS30_ENABLED=1
    -D INA219_ENABLED=1
    -D VEML7700_ENABLED=1
    -D BLE_ENABLED=1
    -D BATTERY_ENABLED=1
    -D LORAWAN_ENABLED=1
    -D DEEP_SLEEP_ENABLED=1
    -D MPU6050_ENABLED=1
    -D OLED_ENABLED=1

; Upload options
upload_protocol = nrfutil
; Uncomment and set the correct port (check: ls /dev/cu.usbmodem*)
; upload_port = /dev/cu.usbmodem1101
; J-Link alternative (requires hardware programmer):
; upload_protocol = jlink

; Library dependencies
lib_deps =
    mikalhart/TinyGPSPlus
    beegee-tokyo/SX126x-Arduino
    adafruit/Adafruit SHT31 Library
    adafruit/Adafruit INA219
    https://github.com/adafruit/Adafruit_VEML7700
    https://github.com/paulvha/sps30
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.3
